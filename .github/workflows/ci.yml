name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchains
        uses: jdx/mise-action@v3
      - name: Go tests and checks
        run: |
          go test ./...
          CGO_ENABLED=1 go test -race ./...
          go vet ./...
      - name: Node tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Build and validate local npm packages
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = '${{ matrix.target }}'
          npm run pack:local
          npm run test:package
      - name: Upload local package artifacts (no publishing)
        uses: actions/upload-artifact@v4
        with:
          name: learning-wiki-${{ matrix.target }}
          path: |
            dist/*.tgz
            dist/artifacts.json
          retention-days: 7
