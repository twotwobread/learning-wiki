name: npm release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize all versions, including approval and partial-publish retries.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned toolchains from mise.toml
        uses: jdx/mise-action@v3
      - name: Validate release checkout and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/release.mjs preflight "$RELEASE_TAG"
      - name: Go tests and checks
        run: |
          go test ./...
          CGO_ENABLED=1 go test -race ./...
          go vet ./...
      - name: Node tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Build and verify release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run pack:local
          node scripts/release.mjs verify "$RELEASE_TAG" dist
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-release
          if-no-files-found: error
          path: |
            dist/artifacts.json
            dist/*.tgz
          retention-days: 14

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
        with:
          tools: node@22.23.3
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: dist
      - name: Verify and smoke test the release artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "$EXPECTED_TARGET"
          node scripts/release.mjs verify "$RELEASE_TAG" dist
          npm run test:package

  publish:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Node from mise.toml
        uses: jdx/mise-action@v3
        with:
          tools: node@22.23.3
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: dist
      - name: Verify and publish the approved artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release.mjs verify "$RELEASE_TAG" dist
          node scripts/release.mjs publish "$RELEASE_TAG" dist
